<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B6D94C"/>
      <stop offset="100%" stop-color="#294D2C"/>
    </linearGradient>
    <linearGradient id="facet-center" x1="16" y1="5" x2="16" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B6D94C"/>
      <stop offset="45%" stop-color="#B6D94C"/>
      <stop offset="100%" stop-color="#2E5A26"/>
    </linearGradient>
    <linearGradient id="facet-left" x1="8" y1="7" x2="16" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B6D94C"/>
      <stop offset="100%" stop-color="#1E3E20"/>
    </linearGradient>
    <linearGradient id="facet-right" x1="24" y1="7" x2="16" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6F9D3B"/>
      <stop offset="100%" stop-color="#112513"/>
    </linearGradient>
    <linearGradient id="facet-top" x1="16" y1="4" x2="16" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EDF8DE"/>
      <stop offset="100%" stop-color="#B6D94C"/>
    </linearGradient>
  </defs>

  <!-- Background Base Disc for Contrast across light and dark browser themes -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.25" fill="none" stroke="url(#ring)" stroke-width="1.2" stroke-opacity="0.7"/>

  <!-- Tourmaline Crystal Geometry (Striated Elongated Trigonal/Hexagonal Prism) -->
  <!-- Top Termination (Pointed crystal pyramid) -->
  <polygon points="16,5 10.5,9.5 16,11.5" fill="url(#facet-top)"/>
  <polygon points="16,5 16,11.5 21.5,9.5" fill="#B6D94C" opacity="0.9"/>
  <polygon points="16,5 10.5,9.5 16,7.5" fill="#FFFFFF" opacity="0.6"/>

  <!-- Main Prism Column - Left Facet -->
  <polygon points="10.5,9.5 16,11.5 16,26.5 10.5,24.5" fill="url(#facet-left)"/>

  <!-- Main Prism Column - Center Facet (Vibrant Tourmaline Green Highlight) -->
  <polygon points="16,11.5 16,26.5 18.5,25.8 18.5,10.8" fill="url(#facet-center)"/>

  <!-- Main Prism Column - Right Facet (Deep Forest Absorption) -->
  <polygon points="18.5,10.8 18.5,25.8 21.5,24.5 21.5,9.5" fill="url(#facet-right)"/>

  <!-- Striation Lines (Authentic Rough Tourmaline Growth Vertical Lines) -->
  <line x1="13.2" y1="10.5" x2="13.2" y2="25.2" stroke="#B6D94C" stroke-width="0.6" stroke-opacity="0.45"/>
  <line x1="16" y1="11.5" x2="16" y2="26.5" stroke="#FFFFFF" stroke-width="0.75" stroke-opacity="0.7"/>
  <line x1="18.5" y1="10.8" x2="18.5" y2="25.8" stroke="#0E2310" stroke-width="0.6" stroke-opacity="0.85"/>

  <!-- Prismatic Specular Highlight -->
  <circle cx="16" cy="6.5" r="0.9" fill="#FFFFFF"/>
</svg>
